name: Build & Push Dispatcher Image (GHCR)

# Modelo pull: el build pasa acá (runner) y la imagen se publica en GHCR.
# El VPS la BAJA (docker pull, outbound) — no requiere inbound SSH desde GitHub,
# que la red de Hostinger filtra (runners Azure, IPs rotativas). Reemplaza el
# viejo deploy.yml push-SSH (que ahora corre solo on-demand como fallback).
#
# Imagen: DUAL-PUSH (runbook machine-accounts F2, gap handbook#313):
#   ghcr.io/palmadevai/palmadevai-dispatcher  (historico, linkeado a este repo)
#   ghcr.io/palmadevai/palmadev-dispatcher    (linkeado a tooling-dist -> lo
#     heredan los bots de cliente; es el que consume DISPATCHER_IMAGE)
# El push al nuevo requiere Manage Actions access (Write) en ese package.
# Sin build-args:
# es un worker Node/TS, toda la config se resuelve en runtime (env/Postgres).
# Doc canónico: handbook/docs/technical-gitops-pull-deploy.md.

on:
  push:
    branches: [main]
    paths-ignore:
      # Un merge que solo toca documentacion produce una imagen IDENTICA: el
      # `COPY . .` es del stage builder y la imagen final se arma con
      # /app/public + /app/.next/{standalone,static} (o src/ + dist/ en los
      # servicios TS), asi que ningun .md llega al artefacto. Verificado ademas
      # que ningun sitio lee markdown en build-time.
      # Medido sobre agosto/2026: 18 de 130 builds (14%) fueron doc-only, y los
      # dos disparadores mas comunes eran AGENTS.md y este mismo archivo.
      # Para forzar un build igual: `workflow_dispatch` (abajo).
      - '**.md'
      - 'doc/**'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

# Solo la imagen del ultimo merge sirve. Si entran varios merges seguidos, los
# builds anteriores quedan superados antes de terminar: cancelarlos ahorra
# minutos de Actions -los builds son jobs de 3-4 minutos reales, el bloque mas
# caro del presupuesto- y no hay riesgo, porque el deploy referencia `:latest`
# y la imagen previa sigue sirviendo hasta que la nueva la reemplace.
# Contexto y numeros medidos: handbook/docs/analysis-costo-ci-actions.md
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 👤 2026-08-26 — EL CANDADO. Un `main` con la suite rota no produce imagen, y
  # por lo tanto no llega al VPS (el deploy referencia `:latest`; si no hay
  # imagen nueva, sigue sirviendo la anterior, que es el comportamiento correcto
  # ante un main roto).
  #
  # Va acá y no en `tests.yml` porque GitHub no ofrece `required_status_checks`
  # en repos privados del plan free: un check aparte se ve rojo pero no impide
  # mergear. `needs:` es el único gate mecánico disponible en este plan — no
  # depende de que alguien mire el PR.
  #
  # Corre el MISMO comando que `tests.yml`; no se comparte via `workflow_call`
  # a propósito: la duplicación son 6 líneas, y acoplarlos haría que un cambio
  # en el workflow del PR pueda romper el gate del deploy sin tocarlo.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-push:
    needs: test
    # DÓNDE CORRE (F1a.P3, 2ª mitad — 2026-08-31): con la variable de repo
    # `BUILD_RUNNER=contolab` el build va al runner self-hosted del box, que NO
    # tiene daemon Docker: buildx le habla al buildkitd rootless (F1a.C6) por el
    # socket, con el driver `remote`. Sin la variable vuelve a `ubuntu-latest` con
    # el driver de siempre. Una receta, dos destinos — ver los dos steps de abajo.
    # Variable PROPIA, separada de GATES_RUNNER a propósito: si un build da
    # problema en el box se lo devuelve a hosted sin arrastrar los gates con él.
    # En el runner del box los minutos NO se facturan.
    # ESCAPE si el box cae, SIN PR:
    #   gh variable delete BUILD_RUNNER --repo palmadevai/<repo>
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # En el box no hay daemon Docker: el driver `remote` habla directo con
          # el socket de buildkitd. En hosted queda el driver de siempre.
          # Verificado en el laboratorio antes de tocar este repo: contolab
          # `build-image-smoke` run 33385130672, con `billable: {}`.
          driver: ${{ vars.BUILD_RUNNER && 'remote' || 'docker-container' }}
          endpoint: ${{ vars.BUILD_RUNNER && 'unix:///run/buildkit/buildkitd.sock' || '' }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:latest
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}
            ghcr.io/palmadevai/palmadev-dispatcher:latest
            ghcr.io/palmadevai/palmadev-dispatcher:${{ github.sha }}
          # `type=gha` SÓLO en hosted. En el box no sirve y además rompe: el
          # buildkitd del box es v0.18.2 y le pega al endpoint v1 del cache de
          # Actions, que GitHub ya apagó — se come una página HTML de error
          # donde espera JSON (medido: contolab run 33384854847).
          # El arreglo NO es bumpear buildkitd: ahí ese cache SOBRA. buildkitd
          # guarda el suyo en un volumen, o sea que persiste entre jobs y entre
          # reinicios; `type=gha` existe porque los runners hosted son efímeros.
          #
          # ⚠ LA CONDICIÓN VA AL REVÉS A PROPÓSITO, y cuesta una corrida entender por qué.
          # La forma «natural» —`vars.BUILD_RUNNER && '' || 'type=gha'`— está MAL: en las
          # expresiones de GitHub `a && b || c` devuelve VALORES, no booleanos, y cuando la
          # rama verdadera es `''` (falsy) el `||` se la come y cae siempre en `c`. O sea que
          # esa forma deja `type=gha` prendido SIEMPRE, incluso en el box. Medido:
          # palmadevai-arca-svc run 33385823088 — la imagen se buildeo y se pusheo bien, y el
          # job se puso en rojo recién en «exporting to GitHub Actions Cache».
          # Por eso se pregunta por el caso VACÍO, que deja el valor no-vacío del lado
          # verdadero: `X == '' && 'type=gha' || ''` sí hace lo que dice.
          cache-from: ${{ vars.BUILD_RUNNER == '' && 'type=gha' || '' }}
          cache-to: ${{ vars.BUILD_RUNNER == '' && 'type=gha,mode=max' || '' }}
