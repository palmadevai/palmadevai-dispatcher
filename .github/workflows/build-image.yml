name: Build & Push Dispatcher Image (GHCR)

# Modelo pull: el build pasa acá (runner) y la imagen se publica en GHCR.
# El VPS la BAJA (docker pull, outbound) — no requiere inbound SSH desde GitHub,
# que la red de Hostinger filtra (runners Azure, IPs rotativas). Reemplaza el
# viejo deploy.yml push-SSH (que ahora corre solo on-demand como fallback).
#
# Imagen: DUAL-PUSH (runbook machine-accounts F2, gap handbook#313):
#   ghcr.io/palmadevai/palmadevai-dispatcher  (historico, linkeado a este repo)
#   ghcr.io/palmadevai/palmadev-dispatcher    (linkeado a tooling-dist -> lo
#     heredan los bots de cliente; es el que consume DISPATCHER_IMAGE)
# El push al nuevo requiere Manage Actions access (Write) en ese package.
# Sin build-args:
# es un worker Node/TS, toda la config se resuelve en runtime (env/Postgres).
# Doc canónico: handbook/docs/technical-gitops-pull-deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo la imagen del ultimo merge sirve. Si entran varios merges seguidos, los
# builds anteriores quedan superados antes de terminar: cancelarlos ahorra
# minutos de Actions -los builds son jobs de 3-4 minutos reales, el bloque mas
# caro del presupuesto- y no hay riesgo, porque el deploy referencia `:latest`
# y la imagen previa sigue sirviendo hasta que la nueva la reemplace.
# Contexto y numeros medidos: handbook/docs/analysis-costo-ci-actions.md
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:latest
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}
            ghcr.io/palmadevai/palmadev-dispatcher:latest
            ghcr.io/palmadevai/palmadev-dispatcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
