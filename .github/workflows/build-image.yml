name: Build & Push Dispatcher Image (GHCR)

# Modelo pull: el build pasa acá (runner) y la imagen se publica en GHCR.
# El VPS la BAJA (docker pull, outbound) — no requiere inbound SSH desde GitHub,
# que la red de Hostinger filtra (runners Azure, IPs rotativas). Reemplaza el
# viejo deploy.yml push-SSH (que ahora corre solo on-demand como fallback).
#
# Imagen: DUAL-PUSH (runbook machine-accounts F2, gap handbook#313):
#   ghcr.io/palmadevai/palmadevai-dispatcher  (historico, linkeado a este repo)
#   ghcr.io/palmadevai/palmadev-dispatcher    (linkeado a tooling-dist -> lo
#     heredan los bots de cliente; es el que consume DISPATCHER_IMAGE)
# El push al nuevo requiere Manage Actions access (Write) en ese package.
# Sin build-args:
# es un worker Node/TS, toda la config se resuelve en runtime (env/Postgres).
# Doc canónico: handbook/docs/technical-gitops-pull-deploy.md.

on:
  push:
    branches: [main]
    paths-ignore:
      # Un merge que solo toca documentacion produce una imagen IDENTICA: el
      # `COPY . .` es del stage builder y la imagen final se arma con
      # /app/public + /app/.next/{standalone,static} (o src/ + dist/ en los
      # servicios TS), asi que ningun .md llega al artefacto. Verificado ademas
      # que ningun sitio lee markdown en build-time.
      # Medido sobre agosto/2026: 18 de 130 builds (14%) fueron doc-only, y los
      # dos disparadores mas comunes eran AGENTS.md y este mismo archivo.
      # Para forzar un build igual: `workflow_dispatch` (abajo).
      - '**.md'
      - 'doc/**'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

# Solo la imagen del ultimo merge sirve. Si entran varios merges seguidos, los
# builds anteriores quedan superados antes de terminar: cancelarlos ahorra
# minutos de Actions -los builds son jobs de 3-4 minutos reales, el bloque mas
# caro del presupuesto- y no hay riesgo, porque el deploy referencia `:latest`
# y la imagen previa sigue sirviendo hasta que la nueva la reemplace.
# Contexto y numeros medidos: handbook/docs/analysis-costo-ci-actions.md
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # 👤 2026-08-26 — EL CANDADO. Un `main` con la suite rota no produce imagen, y
  # por lo tanto no llega al VPS (el deploy referencia `:latest`; si no hay
  # imagen nueva, sigue sirviendo la anterior, que es el comportamiento correcto
  # ante un main roto).
  #
  # Va acá y no en `tests.yml` porque GitHub no ofrece `required_status_checks`
  # en repos privados del plan free: un check aparte se ve rojo pero no impide
  # mergear. `needs:` es el único gate mecánico disponible en este plan — no
  # depende de que alguien mire el PR.
  #
  # Corre el MISMO comando que `tests.yml`; no se comparte via `workflow_call`
  # a propósito: la duplicación son 6 líneas, y acoplarlos haría que un cambio
  # en el workflow del PR pueda romper el gate del deploy sin tocarlo.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:latest
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}
            ghcr.io/palmadevai/palmadev-dispatcher:latest
            ghcr.io/palmadevai/palmadev-dispatcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
