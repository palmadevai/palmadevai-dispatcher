name: Deploy Dispatcher

# Patrón canónico (igual cockpit/chat-site/web): SSH al VPS, git clone/pull
# a /opt/<repo-name>, docker build LOCAL en el VPS, docker compose up con
# --force-recreate. Sin GHCR, sin registry externo. Tag imagen: dispatcher:latest.
#
# Secrets requeridos (Settings > Secrets):
# - VPS_HOST: hostname o IP del VPS del cliente
# - SSH_PRIVATE_KEY: SSH key con root@VPS
# - REPO_URL no necesario: usamos github.token + repo HTTPS authed via
#   x-access-token (mismo patrón que cockpit/chat-site).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          command_timeout: 10m
          envs: GH_TOKEN,REPO,REPO_NAME
          script: |
            set -e

            TARGET="/opt/${REPO_NAME}"
            # SLUG = primera palabra antes del PRIMER hyphen (%%-* greedy from front).
            # palmadevai-dispatcher -> palmadevai. egeriatravel-dispatcher -> egeriatravel.
            # NO usar %-* (lazy from back), rompe con repos multi-hyphen.
            SLUG="${REPO_NAME%%-*}"
            ENV_FILE="/srv/palmadev/${SLUG}/.env"
            AUTHED_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            CLEAN_URL="https://github.com/${REPO}.git"

            # --- Sync repo ---
            if [ -d "$TARGET/.git" ]; then
              cd "$TARGET"
              git remote set-url origin "$AUTHED_URL"
              git fetch origin main
              git reset --hard origin/main
              git remote set-url origin "$CLEAN_URL"
            else
              rm -rf "$TARGET"
              git clone "$AUTHED_URL" "$TARGET"
              cd "$TARGET"
              git remote set-url origin "$CLEAN_URL"
            fi
            echo "Sync completado: $(date)"

            # --- Build Docker image localmente en el VPS ---
            echo "Building dispatcher image..."
            docker build -t dispatcher:latest "$TARGET"
            echo "Image built: $(date)"

            # --- Recrear dispatcher via compose para tomar la nueva imagen ---
            # Stack 93-dispatcher es opt-in (gated por MODULES_OUTBOUND_WORKER).
            # Si el compose no existe O .env no existe O stack no está activado,
            # solo se buildea la imagen — el stack se levanta cuando el operador
            # corra el infra deploy con MODULES_OUTBOUND_WORKER=true.
            INFRA_DIR="/opt/${SLUG}-infra"
            COMPOSE_FILE="$INFRA_DIR/stacks/93-dispatcher/compose.yaml"
            if [ -f "$COMPOSE_FILE" ] && [ -f "$ENV_FILE" ]; then
              # Chequear si el stack está habilitado para este cliente.
              if grep -qE "^STACKS_ENABLED=.*93-dispatcher" "$ENV_FILE"; then
                echo "Recreando dispatcher via compose..."
                docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --force-recreate dispatcher
              else
                echo "INFO: 93-dispatcher NOT in STACKS_ENABLED — imagen buildeada, container no recreado"
              fi
            else
              echo "WARN: $COMPOSE_FILE o $ENV_FILE no encontrado — solo se buildeó la imagen (corré infra deploy primero)"
            fi
